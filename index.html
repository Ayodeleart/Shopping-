<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#D91C2D" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="app-icon-32.png">
<title>Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ── THEME TOKENS ─────────────────────────────────── */
:root{
  --bg:#fff;--bg2:#f5f5f5;--bg3:#ebebeb;--card:#fff;
  --txt:#111;--txt2:#555;--txt3:#888;
  --red:#D91C2D;--red2:#a81422;
  --border:#e8e8e8;
  --hh:52px;
}
[data-theme=dark]{
  --bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#252525;--card:#1a1a1a;
  --txt:#f0f0f0;--txt2:#aaa;--txt3:#666;
  --red:#e8192c;--red2:#c01525;
  --border:#2a2a2a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
img{display:block;object-fit:cover}
a{text-decoration:none;color:inherit}
input{font-family:inherit;color:inherit;-webkit-appearance:none;outline:none}

/* ── HEADER ───────────────────────────────────────── */
#hdr{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:var(--hh);background:var(--bg);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:10px;
  transition:background .2s,border-color .2s;
}
#menuBtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--txt)}
#storeLogo{flex:1;font-size:20px;font-weight:900;letter-spacing:-1px;color:var(--txt);line-height:1}
.hdr-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--txt);position:relative}
.hdr-icon:active{opacity:.6}
#cartDot{position:absolute;top:4px;right:4px;width:16px;height:16px;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:8px;display:none;align-items:center;justify-content:center}

/* ── STICKY SEARCH ────────────────────────────────── */
#searchWrap{
  position:sticky;top:var(--hh);z-index:190;
  background:var(--bg);padding:8px 12px;
  border-bottom:1px solid var(--border);
}
#searchBar{
  display:flex;align-items:center;gap:8px;
  background:var(--bg2);border-radius:8px;
  padding:0 12px;height:40px;
  border:1.5px solid var(--border);
}
#searchBar svg{color:var(--txt3);flex-shrink:0}
#searchInput{flex:1;border:none;background:transparent;font-size:14px;color:var(--txt);height:100%}
#searchInput::placeholder{color:var(--txt3)}
#srchClearBtn{display:none;color:var(--txt3);flex-shrink:0}

/* ── SEARCH RESULTS DROPDOWN ──────────────────────── */
#srchDropdown{
  position:fixed;top:calc(var(--hh) + 57px);left:0;right:0;bottom:0;
  z-index:180;background:var(--bg);overflow-y:auto;
  display:none;
}
#srchDropdown.open{display:block}
.sri{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.sri:active{background:var(--bg2)}
.sri-img{width:52px;height:52px;border-radius:8px;background:var(--bg2);flex-shrink:0;object-fit:cover}
.sri-name{font-size:14px;font-weight:600;margin-bottom:2px}
.sri-price{font-size:13px;color:var(--red);font-weight:700}
#srchEmpty{padding:48px 20px;text-align:center;color:var(--txt3);font-size:14px}

/* ── CALL TO ORDER ────────────────────────────────── */
#callBar{
  background:var(--red);color:#fff;
  text-align:center;font-size:14px;font-weight:700;
  padding:8px 14px;letter-spacing:.3px;
  display:none;
}
#callBar.show{display:block}

/* ── MAIN ─────────────────────────────────────────── */
#main{padding-top:calc(var(--hh) + 57px)}

/* ── INSTALL BANNER ───────────────────────────────── */
#instBar{
  background:var(--red);color:#fff;padding:8px 12px;
  display:none;align-items:center;gap:8px;font-size:13px;
}
#instBar.show{display:flex}
#instBtn{margin-left:auto;background:#fff;color:var(--red);font-weight:800;font-size:11px;padding:5px 12px;border-radius:20px;flex-shrink:0}
#instX{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── HERO CAROUSEL ────────────────────────────────── */
#hero{position:relative;overflow:hidden;background:var(--bg2)}
#heroTrack{display:flex;transition:transform .5s cubic-bezier(.4,0,.2,1);will-change:transform}
.hSlide{
  min-width:100%;height:196px;flex-shrink:0;
  position:relative;overflow:hidden;
  display:flex;align-items:flex-end;
}
.hSlide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hGrad{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,transparent 55%)}
.hContent{position:relative;z-index:1;padding:14px 14px 18px;color:#fff;width:100%}
.hBadge{display:inline-block;background:var(--red);font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.hTitle{font-size:20px;font-weight:900;line-height:1.15;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.hSub{font-size:12px;opacity:.9;margin-top:3px;margin-bottom:8px}
.hCta{display:inline-block;background:#fff;color:var(--red);font-size:12px;font-weight:800;padding:6px 15px;border-radius:20px}
.noSlide{height:196px;display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:13px}
#heroDots{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2}
.hdot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:all .3s;cursor:pointer}
.hdot.on{background:#fff;width:18px}
.hArrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(0,0,0,.3);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#hPrev{left:8px}#hNext{right:8px}

/* ── SHORTCUT CARDS ───────────────────────────────── */
#shortcutRow{
  display:flex;gap:0;overflow-x:auto;
  padding:12px 10px 4px;scrollbar-width:none;
  background:var(--bg);border-bottom:6px solid var(--bg2);
}
#shortcutRow::-webkit-scrollbar{display:none}
#vendorRow{display:flex;gap:14px;overflow-x:auto;padding:2px 13px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#vendorRow::-webkit-scrollbar{display:none}
.vcard{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:64px}
.vcard-img{width:56px;height:56px;border-radius:50%;background:var(--bg2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:800;font-size:18px;color:var(--txt3)}
.vcard-img img{width:100%;height:100%;object-fit:cover}
.vcard-lbl{font-size:11px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
.scut{
  flex-shrink:0;width:88px;display:flex;flex-direction:column;
  align-items:center;gap:5px;padding:0 4px 8px;cursor:pointer;
}
.scut:active .scut-img{transform:scale(.95)}
.scut-img{
  width:76px;height:76px;border-radius:10px;overflow:hidden;
  background:var(--bg2);display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.scut-img img{width:100%;height:100%;object-fit:cover}
.scut-lbl{
  font-size:11px;font-weight:600;color:var(--txt2);
  text-align:center;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  width:100%;
}

/* ── SECTION GAP ──────────────────────────────────── */
.sgap{height:8px;background:var(--bg2)}

/* ── SECTION HEADER ───────────────────────────────── */
.secHd{display:flex;align-items:center;justify-content:space-between;padding:13px 13px 9px;background:var(--bg)}
.secTtl{font-size:15px;font-weight:800;letter-spacing:-.2px}
.secAll{font-size:13px;color:var(--red);font-weight:700}

/* ── FLASH SALE ───────────────────────────────────── */
.flashHd{
  background:var(--red);display:flex;align-items:center;
  padding:10px 13px;gap:8px;
}
.flashTtl{font-size:15px;font-weight:900;color:#fff;display:flex;align-items:center;gap:5px}
#cdWrap{display:flex;align-items:center;gap:3px;margin-left:auto}
.cbt{background:rgba(0,0,0,.2);border-radius:5px;padding:3px 6px;min-width:36px;text-align:center}
.cbt span{display:block;font-size:15px;font-weight:900;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.cbt label{display:block;font-size:8px;color:rgba(255,255,255,.75);font-weight:700;letter-spacing:.5px;margin-top:1px}
.csep{font-size:14px;font-weight:900;color:rgba(255,255,255,.5)}
.flashSeeAll{color:rgba(255,255,255,.9);font-size:12px;font-weight:700;margin-left:8px;flex-shrink:0}
@keyframes nt{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.nt{animation:nt .14s ease-out}

#flashScroll{
  display:flex;gap:0;overflow-x:auto;background:var(--bg);
  scrollbar-width:none;border-bottom:1px solid var(--border);
}
#flashScroll::-webkit-scrollbar{display:none}
.fcard-wrap{padding:10px 6px 10px;flex-shrink:0;width:156px}
.fcard-wrap:first-child{padding-left:12px}
.fcard-wrap:last-child{padding-right:12px}

/* ── PRODUCT CARD (JUMIA STYLE) ───────────────────── */
.pcard{
  background:var(--card);border-radius:4px;overflow:hidden;
  cursor:pointer;border:1px solid var(--border);
  transition:transform .15s;
  -webkit-transform:translateZ(0);
}
.pcard:active{transform:scale(.97)}

/* IMAGE AREA */
.pcImg{
  position:relative;padding-top:100%;
  background:#fff;overflow:hidden;
}
.pcImg img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;padding:6px;
}
.noImgPh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--txt3);background:var(--bg2)}

/* DISCOUNT BADGE — circular, top right, like Jumia */
.discBadge{
  position:absolute;top:6px;right:6px;
  background:var(--red);color:#fff;
  font-size:11px;font-weight:800;
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  text-align:center;line-height:1.1;
  z-index:1;
}

/* BODY */
.pcBody{padding:8px 9px 10px}
.pcName{
  font-size:13px;font-weight:400;color:var(--txt2);
  line-height:1.3;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pcPrice{font-size:17px;font-weight:900;color:var(--txt);margin-bottom:1px}
.pcWas{font-size:12px;color:var(--txt3);text-decoration:line-through;margin-bottom:5px}
.pcStockRow{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.pcBar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.pcBarFill{height:100%;background:var(--red);border-radius:2px;transition:width .3s}
.pcStockTxt{font-size:11px;color:var(--txt3);white-space:nowrap;flex-shrink:0}
.pcAdd{
  width:100%;height:34px;background:var(--red);color:#fff;
  font-size:13px;font-weight:700;border-radius:4px;
  transition:background .12s;
}
.pcAdd:active{background:var(--red2)}

/* GRID */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);padding:0}
.pgrid-wrap{background:var(--bg);padding-bottom:16px}
.pgrid > div{background:var(--bg)}

/* EMPTY */
.empty{
  padding:48px 20px;text-align:center;color:var(--txt3);
  grid-column:1/-1;background:var(--bg);
}
.empty h3{font-size:15px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.empty p{font-size:13px}

/* SCROLL ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.au{opacity:0}.au.v{animation:fadeUp .3s ease-out forwards}
.d0{animation-delay:0ms}.d1{animation-delay:40ms}.d2{animation-delay:80ms}.d3{animation-delay:120ms}

/* ── PRODUCT MODAL (FULL SCREEN SLIDE UP) ──────────── */
#pModal{
  position:fixed;inset:0;z-index:300;
  background:var(--bg);transform:translateY(100%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
#pModal.open{transform:translateY(0)}
#pModalHdr{
  position:sticky;top:0;z-index:1;
  height:var(--hh);background:var(--bg);
  display:flex;align-items:center;padding:0 12px;gap:10px;
  border-bottom:1px solid var(--border);
}
#pModalBack{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--txt)}
#pModalTitle{flex:1;font-size:15px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#pModalImg{background:#fff;border-bottom:1px solid var(--border)}
#pModalImg img{width:100%;aspect-ratio:1/1;object-fit:contain;padding:12px;max-height:300px}
#pModalBody{padding:14px}
#pModalName{font-size:17px;font-weight:800;margin-bottom:10px;line-height:1.3}
.mpRow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#pModalPrice{font-size:24px;font-weight:900}
#pModalWas{font-size:14px;color:var(--txt3);text-decoration:line-through}
#pModalDisc{font-size:13px;font-weight:800;color:var(--red)}
#pModalDesc{font-size:14px;color:var(--txt2);line-height:1.65;margin-bottom:14px}
.mStockRow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt2);margin-bottom:18px}
.mSbar{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.mSfill{height:100%;background:var(--red);border-radius:3px}
#pModalAddBtn{
  width:100%;height:50px;background:var(--red);color:#fff;
  font-size:16px;font-weight:800;border-radius:6px;
  margin-bottom:calc(env(safe-area-inset-bottom) + 8px);
}
#pModalAddBtn:active{background:var(--red2)}

/* ── CART DRAWER ──────────────────────────────────── */
#cartOver{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,0);pointer-events:none;transition:background .28s}
#cartOver.open{background:rgba(0,0,0,.5);pointer-events:all}
#cartDrawer{
  position:fixed;bottom:0;left:0;right:0;z-index:260;
  background:var(--bg);border-radius:20px 20px 0 0;
  max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
#cartDrawer.open{transform:translateY(0)}
.cDrag{width:36px;height:4px;background:var(--bg3);border-radius:2px;margin:10px auto 0}
.cTop{display:flex;align-items:center;justify-content:space-between;padding:12px 15px 8px}
.cTop h3{font-size:17px;font-weight:800}
#cartCloseBtn{width:30px;height:30px;background:var(--bg2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--txt2)}
#cartList{flex:1;overflow-y:auto;padding:0 13px}
.cItem{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.cItem:last-child{border-bottom:none}
.cItemImg{width:56px;height:56px;border-radius:6px;object-fit:contain;background:#fff;border:1px solid var(--border);flex-shrink:0;padding:4px}
.cItemInfo{flex:1;min-width:0}
.cItemName{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cItemPrice{font-size:14px;font-weight:800;color:var(--red);margin-top:2px}
.cQty{display:flex;align-items:center;gap:8px;margin-top:5px}
.qb{width:26px;height:26px;border-radius:5px;background:var(--bg2);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.qb:active{background:var(--bg3)}
.qn{font-size:14px;font-weight:700;min-width:18px;text-align:center}
.cDel{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--txt3);flex-shrink:0}
.cFoot{padding:12px 15px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.cTotalRow{display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin-bottom:12px}
#checkoutBtn{width:100%;height:50px;background:var(--red);color:#fff;font-size:16px;font-weight:800;border-radius:6px}
#checkoutBtn:active{background:var(--red2)}
.cEmpty{padding:36px;text-align:center;color:var(--txt3)}
.cEmpty svg{margin:0 auto 10px;opacity:.28}

/* ── CHECKOUT SHEET ───────────────────────────────── */
#chkOver{position:fixed;inset:0;z-index:350;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
#chkOver.open{display:flex}
#chkSheet{
  background:var(--bg);border-radius:20px 20px 0 0;width:100%;
  padding:22px 16px calc(22px + env(safe-area-inset-bottom));
  animation:su .28s ease-out;
}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
#chkSheet h3{font-size:17px;font-weight:800;margin-bottom:16px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg textarea{
  width:100%;height:44px;border:1.5px solid var(--border);
  border-radius:8px;padding:0 12px;font-size:15px;
  background:var(--bg);color:var(--txt);outline:none;transition:border-color .2s;
}
.fg input:focus,.fg textarea:focus{border-color:var(--red)}
.fg textarea{height:72px;padding:10px 12px;resize:none}
#placeBtn{width:100%;height:50px;background:var(--red);color:#fff;font-size:16px;font-weight:800;border-radius:6px;margin-top:4px}
#placeBtn:active{background:var(--red2)}
#cancelChkBtn{width:100%;height:40px;font-size:13px;color:var(--txt2);margin-top:6px}

/* ── SIDE MENU ────────────────────────────────────── */
#menuOver{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,0);pointer-events:none;transition:background .28s}
#menuOver.open{background:rgba(0,0,0,.5);pointer-events:all}
#menuDrawer{
  position:fixed;top:0;left:0;bottom:0;z-index:260;
  width:76%;max-width:280px;background:var(--bg);
  transform:translateX(-105%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
#menuDrawer.open{transform:translateX(0)}
.mHead{padding:20px 15px 14px;border-bottom:1px solid var(--border)}
.mStoreName{font-size:19px;font-weight:900}
.mTag{font-size:13px;color:var(--txt3);margin-top:2px}
.mLinks{flex:1;overflow-y:auto;padding:6px 0}
.mLink{display:flex;align-items:center;gap:12px;padding:13px 15px;font-size:15px;font-weight:600;color:var(--txt)}
.mLink svg{color:var(--txt3);flex-shrink:0}
.mLink:active{background:var(--bg2)}
.mFoot{padding:14px 15px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.mThemeRow{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--txt2)}
.tgl{width:44px;height:24px;background:var(--bg3);border-radius:12px;position:relative;cursor:pointer;transition:background .22s;border:1.5px solid var(--border)}
.tgl.on{background:var(--red);border-color:var(--red)}
.tgl-k{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .22s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on .tgl-k{transform:translateX(20px)}

/* ── TOAST ────────────────────────────────────────── */
#toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(12px);
  background:rgba(0,0,0,.85);color:#fff;
  font-size:13px;font-weight:600;padding:9px 18px;
  border-radius:30px;white-space:nowrap;opacity:0;
  pointer-events:none;transition:all .22s;z-index:400;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LOADER ───────────────────────────────────────── */
#loader{
  position:fixed;inset:0;z-index:500;background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
}
#loader.done{opacity:0;pointer-events:none;transition:opacity .3s}
.spin{width:28px;height:28px;border:3px solid var(--bg3);border-top-color:var(--red);border-radius:50%;animation:sp .7s linear infinite}

<script>
'use strict';

/* ── SUPABASE ─────────────────────────────────────── */
const SB_URL = 'https://qmwlphribvncdtgzbixt.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2xwaHJpYnZuY2R0Z3piaXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDkwMjcsImV4cCI6MjA5NTg4NTAyN30.kmXKSrnQxG6n8RdK6ppNvn05vi7Xl68LKUNW5f7CQCU';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

/* ── THEME ────────────────────────────────────────── */
let dark = localStorage.getItem('theme') === 'dark' ||
  (!localStorage.getItem('theme') && matchMedia('(prefers-color-scheme:dark)').matches);

function applyTheme() {
  document.body.dataset.theme = dark ? 'dark' : 'light';
  document.getElementById('metaTheme').content = dark ? '#111' : '#D91C2D';
  document.getElementById('sunIco').style.display = dark ? 'none' : '';
  document.getElementById('moonIco').style.display = dark ? '' : 'none';
  const t = document.getElementById('mTgl');
  if (t) { t.classList.toggle('on', dark); }
  document.getElementById('themeLabel').textContent = dark ? 'Dark Mode' : 'Light Mode';
}
function toggleTheme() {
  dark = !dark;
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  applyTheme();
}
document.getElementById('themeBtn').onclick = toggleTheme;
applyTheme();

/* ── CAROUSEL ─────────────────────────────────────── */
let cIdx = 0, cBanners = [], cTimer;
let tx0 = 0, ty0 = 0;

function buildCarousel(banners) {
  cBanners = banners;
  const track = document.getElementById('heroTrack');
  const dots  = document.getElementById('heroDots');

  if (!banners.length) {
    document.getElementById('hero').innerHTML = `<div class="noSlide">No banners yet — add some in Admin</div>`;
    return;
  }

  track.innerHTML = banners.map(b => `
    <div class="hSlide">
      ${b.image_url
        ? `<img src="${b.image_url}" alt="${b.title||''}" loading="eager">`
        : `<div style="position:absolute;inset:0;background:${b.bg_color||'#D91C2D'}"></div>`}
      <div class="hGrad"></div>
      <div class="hContent">
        ${b.badge   ? `<span class="hBadge">${b.badge}</span>` : ''}
        ${b.title   ? `<div class="hTitle">${b.title}</div>` : ''}
        ${b.subtitle? `<div class="hSub">${b.subtitle}</div>` : ''}
        ${b.cta_text? `<span class="hCta">${b.cta_text}</span>` : ''}
      </div>
    </div>`).join('');

  dots.innerHTML = banners.map((_,i) =>
    `<div class="hdot${i===0?' on':''}" onclick="goTo(${i})"></div>`).join('');

  goTo(0);
  startCarousel();

  const hero = document.getElementById('hero');
  hero.addEventListener('touchstart', e => {
    tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; stopCarousel();
  }, {passive:true});
  hero.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx0;
    const dy = e.changedTouches[0].clientY - ty0;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 35)
      dx < 0 ? goTo(cIdx+1) : goTo(cIdx-1);
    startCarousel();
  }, {passive:true});
}

function goTo(i) {
  cIdx = ((i % cBanners.length) + cBanners.length) % cBanners.length;
  document.getElementById('heroTrack').style.transform = `translateX(-${cIdx*100}%)`;
  document.querySelectorAll('.hdot').forEach((d,j) => d.classList.toggle('on', j===cIdx));
}
function startCarousel() { stopCarousel(); if (cBanners.length > 1) cTimer = setInterval(() => goTo(cIdx+1), 3800); }
function stopCarousel()  { clearInterval(cTimer); }
document.getElementById('hNext').onclick = () => { goTo(cIdx+1); stopCarousel(); startCarousel(); };
document.getElementById('hPrev').onclick = () => { goTo(cIdx-1); stopCarousel(); startCarousel(); };

/* ── SHORTCUT CARDS ───────────────────────────────── */
function buildShortcuts(shortcuts) {
  const row = document.getElementById('shortcutRow');
  if (!shortcuts.length) { row.style.display = 'none'; return; }
  row.innerHTML = shortcuts.map((s,i) => `
    <div class="scut au d${Math.min(i,3)}">
      <div class="scut-img" style="background:${s.bg_color||'#f5f5f5'}">
        ${s.image_url
          ? `<img src="${s.image_url}" alt="${s.title||''}" loading="lazy">`
          : `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--txt3)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>`}
      </div>
      <span class="scut-lbl">${s.title||''}</span>
    </div>`).join('');
  observeAll(row.querySelectorAll('.au'));
}

/* ── VENDOR ROW ───────────────────────────────────── */
function buildVendorRow(vendors) {
  const sec = document.getElementById('vendorSec');
  const row = document.getElementById('vendorRow');
  if (!vendors.length) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  row.innerHTML = vendors.map(v => `
    <div class="vcard" onclick="filterByVendor('${v.id}','${(v.business_name||'').replace(/'/g,"\\'")}')">
      <div class="vcard-img">${v.logo_url ? `<img src="${v.logo_url}" alt="">` : (v.business_name||'?')[0].toUpperCase()}</div>
      <span class="vcard-lbl">${v.business_name||''}</span>
    </div>`).join('');
}

function filterByVendor(vendorId, vendorName) {
  const filtered = allProds.filter(p => p.vendor_id === vendorId);
  document.getElementById('allSecTitle').textContent = vendorName;
  document.getElementById('pCount').textContent = `${filtered.length} item${filtered.length!==1?'s':''}`;
  renderGrid(filtered, 'allGrid');
  document.getElementById('allSec').scrollIntoView({behavior:'smooth'});
}

/* ── CATEGORY FILTER ──────────────────────────────── */
let activeCat = 'All', allProds = [];

function buildCatFilter(cats) {
  const row = document.getElementById('catFilter');
  if (!cats.length) { row.style.display = 'none'; return; }
  const all = ['All', ...cats];
  row.style.cssText = 'display:flex;gap:7px;overflow-x:auto;padding:0 13px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch';
  row.innerHTML = all.map(c => `
    <button style="
      flex-shrink:0;height:30px;padding:0 13px;border-radius:15px;
      font-size:12px;font-weight:700;white-space:nowrap;
      background:${c===activeCat?'var(--red)':'var(--bg2)'};
      color:${c===activeCat?'#fff':'var(--txt2)'};
      border:1.5px solid ${c===activeCat?'var(--red)':'var(--border)'};
      transition:all .18s;
    " onclick="filterCat('${c}')">${c}</button>`).join('');
}

function filterCat(cat) {
  activeCat = cat;
  const filtered = cat === 'All' ? allProds : allProds.filter(p => p.category === cat);
  buildCatFilter(cat === 'All' ? [...new Set(allProds.map(p => p.category).filter(Boolean))] :
    [...new Set(allProds.map(p => p.category).filter(Boolean))]);
  renderGrid(filtered, 'allGrid');
  document.getElementById('pCount').textContent = `${filtered.length} item${filtered.length!==1?'s':''}`;
}

/* ── COUNTDOWN ────────────────────────────────────── */
let cdTimer;
function startCountdown(endTs) {
  clearInterval(cdTimer);
  function tick() {
    const d = endTs - Date.now();
    if (d <= 0) {
      clearInterval(cdTimer);
      document.getElementById('flashSec').style.display = 'none';
      document.getElementById('flashGap').style.display = 'none';
      return;
    }
    const h=Math.floor(d/3600000), m=Math.floor((d%3600000)/60000), s=Math.floor((d%60000)/1000);
    function set(id,v) {
      const el=document.getElementById(id), str=String(v).padStart(2,'0');
      if (el.textContent!==str) {
        el.textContent=str;
        el.classList.remove('nt');
        requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('nt')));
      }
    }
    set('cdH',h); set('cdM',m); set('cdS',s);
  }
  tick(); cdTimer = setInterval(tick, 1000);
}

/* ── CURRENCY ─────────────────────────────────────── */
let currency = '₦';
const fmt = n => currency + Number(n).toLocaleString('en-NG');

/* ── PRODUCT CARD (JUMIA STYLE) ───────────────────── */
function cardHTML(p) {
  const disc = p.original_price && p.original_price > p.price
    ? Math.round((1 - p.price/p.original_price)*100) : 0;
  const tot = p.max_stock || (p.stock ? p.stock + 15 : 0);
  const pct = tot > 0 ? Math.min(100, Math.round(p.stock/tot*100)) : 0;

  return `
    <div class="pcard" onclick="openProduct(${p.id})">
      <div class="pcImg">
        ${p.image_url
          ? `<img src="${p.image_url}" alt="${p.name}" loading="lazy">`
          : `<div class="noImgPh"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`}
        ${disc > 0 ? `<span class="discBadge">-${disc}%</span>` : ''}
      </div>
      <div class="pcBody">
        <div class="pcName">${p.name}</div>
        <div class="pcPrice">${fmt(p.price)}</div>
        ${disc > 0 ? `<div class="pcWas">${fmt(p.original_price)}</div>` : ''}
        ${p.stock > 0 ? `
          <div class="pcStockRow">
            <div class="pcBar"><div class="pcBarFill" style="width:${pct}%"></div></div>
            <span class="pcStockTxt">${p.stock} left</span>
          </div>` : ''}
        <button class="pcAdd" onclick="event.stopPropagation();addToCart(${p.id})">Add to Cart</button>
      </div>
    </div>`;
}

function buildFlash(prods) {
  const el = document.getElementById('flashScroll');
  el.innerHTML = prods.map(p =>
    `<div class="fcard-wrap au">${cardHTML(p)}</div>`
  ).join('');
  observeAll(el.querySelectorAll('.au'));
}

function renderGrid(prods, id) {
  const el = document.getElementById(id);
  if (!prods.length) {
    el.innerHTML = `<div class="empty"><h3>No products here</h3><p>Check back soon.</p></div>`;
    return;
  }
  el.innerHTML = prods.map((p,i) =>
    `<div class="au d${Math.min(i%4,3)}">${cardHTML(p)}</div>`
  ).join('');
  observeAll(el.querySelectorAll('.au'));
}

/* ── PRODUCT MODAL ────────────────────────────────── */
function openProduct(id) {
  const p = allProds.find(x => x.id===id);
  if (!p) return;
  document.getElementById('pModalTitle').textContent = p.name;
  document.getElementById('pModalName').textContent  = p.name;
  const imgEl = document.getElementById('pModalImgEl');
  if (p.image_url) { imgEl.src = p.image_url; document.getElementById('pModalImg').style.display=''; }
  else document.getElementById('pModalImg').style.display='none';
  document.getElementById('pModalPrice').textContent = fmt(p.price);
  const disc = p.original_price && p.original_price > p.price
    ? Math.round((1-p.price/p.original_price)*100) : 0;
  document.getElementById('pModalWas').textContent  = disc ? fmt(p.original_price) : '';
  document.getElementById('pModalDisc').textContent = disc ? `-${disc}% OFF` : '';
  document.getElementById('pModalDesc').textContent = p.description || '';
  if (p.stock > 0) {
    const tot = p.max_stock || p.stock+15;
    document.getElementById('pModalSFill').style.width = Math.min(100,Math.round(p.stock/tot*100))+'%';
    document.getElementById('pModalSLbl').textContent = `${p.stock} items left`;
    document.querySelector('.mStockRow').style.display='flex';
  } else { document.querySelector('.mStockRow').style.display='none'; }
  document.getElementById('pModalAddBtn').onclick = () => { addToCart(id); closePModal(); };
  document.getElementById('pModal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closePModal() {
  document.getElementById('pModal').classList.remove('open');
  document.body.style.overflow='';
}

/* ── CART ─────────────────────────────────────────── */
let cart = [];
function loadCart() {
  try { cart = JSON.parse(localStorage.getItem('cart_v3')) || []; } catch { cart=[]; }
  updateCartBadge();
}
function saveCart() { localStorage.setItem('cart_v3', JSON.stringify(cart)); }

function addToCart(id) {
  const p = allProds.find(x => x.id===id);
  if (!p) return;
  const ex = cart.find(x => x.id===id);
  if (ex) ex.qty++; else cart.push({id, name:p.name, price:p.price, image_url:p.image_url, vendor_id:p.vendor_id||null, qty:1});
  saveCart(); updateCartBadge();
  toast('Added to cart');
}
function removeFromCart(id) { cart=cart.filter(x=>x.id!==id); saveCart(); updateCartBadge(); renderCartList(); }
function changeQty(id, d) {
  const i=cart.find(x=>x.id===id);
  if (i) { i.qty=Math.max(1,i.qty+d); saveCart(); updateCartBadge(); renderCartList(); }
}
function updateCartBadge() {
  const n = cart.reduce((s,x)=>s+x.qty,0);
  const dot = document.getElementById('cartDot');
  dot.textContent = n; dot.style.display = n>0 ? 'flex' : 'none';
  document.getElementById('cartTotal').textContent = fmt(cart.reduce((s,x)=>s+x.price*x.qty,0));
}
function renderCartList() {
  const el = document.getElementById('cartList');
  if (!cart.length) {
    el.innerHTML=`<div class="cEmpty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><p>Cart is empty</p></div>`;
    return;
  }
  el.innerHTML = cart.map(item => `
    <div class="cItem">
      ${item.image_url
        ? `<img class="cItemImg" src="${item.image_url}" alt="">`
        : `<div class="cItemImg" style="display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--txt3)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div>`}
      <div class="cItemInfo">
        <div class="cItemName">${item.name}</div>
        <div class="cItemPrice">${fmt(item.price)}</div>
        <div class="cQty">
          <button class="qb" onclick="changeQty(${item.id},-1)">-</button>
          <span class="qn">${item.qty}</span>
          <button class="qb" onclick="changeQty(${item.id},1)">+</button>
        </div>
      </div>
      <button class="cDel" onclick="removeFromCart(${item.id})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </button>
    </div>`).join('');
}
function openCart()  { renderCartList(); document.getElementById('cartDrawer').classList.add('open'); document.getElementById('cartOver').classList.add('open'); document.body.style.overflow='hidden'; }
function closeCart() { document.getElementById('cartDrawer').classList.remove('open'); document.getElementById('cartOver').classList.remove('open'); document.body.style.overflow=''; }

/* ── CHECKOUT ─────────────────────────────────────── */
function openCheckout()  { if (!cart.length) { toast('Cart is empty'); return; } closeCart(); document.getElementById('chkOver').classList.add('open'); }
function closeCheckout() { document.getElementById('chkOver').classList.remove('open'); }
document.getElementById('placeBtn').onclick = async () => {
  const name  = document.getElementById('oName').value.trim();
  const phone = document.getElementById('oPhone').value.trim();
  const addr  = document.getElementById('oAddr').value.trim();
  if (!name||!phone||!addr) { toast('Fill all fields'); return; }
  document.getElementById('placeBtn').textContent='Placing...';
  document.getElementById('placeBtn').disabled=true;
  try {
    const {data:orderRow, error} = await sb.from('orders').insert([{
      customer_name:name, phone, address:addr,
      items:cart, total:cart.reduce((s,x)=>s+x.price*x.qty,0), status:'pending'
    }]).select().single();
    if (error) throw error;

    // Split the cart into per-vendor line items so each vendor only ever sees their own orders
    const lineItems = cart.map(x => ({
      order_id: orderRow.id, product_id: x.id, vendor_id: x.vendor_id || null,
      name: x.name, price: x.price, qty: x.qty, status: 'pending'
    }));
    const { error: itemsErr } = await sb.from('order_items').insert(lineItems);
    if (itemsErr) console.error('order_items insert failed:', itemsErr);

    cart=[]; saveCart(); updateCartBadge(); closeCheckout();
    ['oName','oPhone','oAddr'].forEach(id=>document.getElementById(id).value='');
    toast('Order placed! We will contact you soon.');
  } catch(e) {
    toast('Order failed. Try again.'); console.error(e);
  } finally {
    document.getElementById('placeBtn').textContent='Place Order';
    document.getElementById('placeBtn').disabled=false;
  }
};

/* ── SEARCH ───────────────────────────────────────── */
document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const dd = document.getElementById('srchDropdown');
  const clr = document.getElementById('srchClearBtn');
  clr.style.display = q ? '' : 'none';
  if (!q) { dd.classList.remove('open'); return; }
  const res = allProds.filter(p =>
    p.name.toLowerCase().includes(q) ||
    (p.description||'').toLowerCase().includes(q) ||
    (p.category||'').toLowerCase().includes(q)
  );
  dd.classList.add('open');
  if (!res.length) { dd.innerHTML='<div id="srchEmpty">No results found</div>'; return; }
  dd.innerHTML = res.map(p => `
    <div class="sri" onclick="closeSrch();openProduct(${p.id})">
      ${p.image_url
        ? `<img class="sri-img" src="${p.image_url}" alt="">`
        : `<div class="sri-img" style="display:flex;align-items:center;justify-content:center;background:var(--bg2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--txt3)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div>`}
      <div><div class="sri-name">${p.name}</div><div class="sri-price">${fmt(p.price)}</div></div>
    </div>`).join('');
});
function clearSearch() {
  document.getElementById('searchInput').value='';
  document.getElementById('srchClearBtn').style.display='none';
  closeSrch();
}
function closeSrch() {
  document.getElementById('srchDropdown').classList.remove('open');
}

/* ── MENU ─────────────────────────────────────────── */
document.getElementById('menuBtn').onclick = () => {
  document.getElementById('menuDrawer').classList.add('open');
  document.getElementById('menuOver').classList.add('open');
};
function closeMenu() {
  document.getElementById('menuDrawer').classList.remove('open');
  document.getElementById('menuOver').classList.remove('open');
}

/* ── TOAST ────────────────────────────────────────── */
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('on'), 2400);
}

/* ── SCROLL REVEAL ────────────────────────────────── */
let io;
function observeAll(els) {
  if (!io) io = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('v'); io.unobserve(e.target); }
  }), { threshold:0.05, rootMargin:'0px 0px -10px 0px' });
  els.forEach(el => io.observe(el));
}

/* ── PWA ──────────────────────────────────────────── */
let dpr;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); dpr = e;
  if (!localStorage.getItem('instDismissed'))
    document.getElementById('instBar').classList.add('show');
});
document.getElementById('instBtn').onclick = async () => {
  if (!dpr) return;
  dpr.prompt(); await dpr.userChoice; dpr=null;
  document.getElementById('instBar').classList.remove('show');
};
function dismissInstall() {
  document.getElementById('instBar').classList.remove('show');
  localStorage.setItem('instDismissed','1');
}

/* ── INIT ─────────────────────────────────────────── */
async function init() {
  try {
    const [
      {data:products},
      {data:banners},
      {data:shortcuts},
      {data:settings},
      {data:vendors}
    ] = await Promise.all([
      sb.from('products').select('*').order('created_at',{ascending:false}),
      sb.from('banners').select('*').order('sort_order',{ascending:true}),
      sb.from('shortcuts').select('*').order('sort_order',{ascending:true}),
      sb.from('store_settings').select('*'),
      sb.from('vendors').select('*').eq('status','approved').order('business_name',{ascending:true})
    ]);

    const get = k => settings?.find(s=>s.key===k)?.value;
    const storeName  = get('storeName')  || 'Store';
    const tagline    = get('tagline')    || 'Fast delivery. Real deals.';
    const flashEnd   = get('flashSaleEnd') ? parseInt(get('flashSaleEnd')) : null;
    const catsJSON   = get('categories');
    const phone      = get('phone') || '';
    currency = get('currency') || '₦';

    document.getElementById('storeLogo').textContent = storeName;
    document.getElementById('mName').textContent     = storeName;
    document.getElementById('mTag').textContent      = tagline;
    document.title = storeName;

    if (phone) {
      const bar = document.getElementById('callBar');
      bar.textContent = `CALL TO ORDER: ${phone}`;
      bar.classList.add('show');
      document.getElementById('main').style.paddingTop = `calc(var(--hh) + 57px + 37px)`;
    }

    allProds = products || [];
    buildCarousel(banners || []);
    buildShortcuts(shortcuts || []);
    buildVendorRow(vendors || []);

    const cats = catsJSON
      ? JSON.parse(catsJSON)
      : [...new Set(allProds.map(p=>p.category).filter(Boolean))];
    buildCatFilter(cats);

    const flashProds = allProds.filter(p => p.flash_sale);
    if (flashEnd && Date.now() < flashEnd && flashProds.length) {
      document.getElementById('flashSec').style.display = '';
      document.getElementById('flashGap').style.display = '';
      startCountdown(flashEnd);
      buildFlash(flashProds);
    }

    const featured = allProds.filter(p => p.featured);
    if (featured.length) {
      document.getElementById('featSec').style.display = '';
      document.getElementById('featGap').style.display = '';
      renderGrid(featured, 'featGrid');
    }

    renderGrid(allProds, 'allGrid');
    document.getElementById('pCount').textContent =
      `${allProds.length} item${allProds.length!==1?'s':''}`;

  } catch(err) {
    console.error(err);
    document.getElementById('allGrid').innerHTML =
      `<div class="empty"><h3>Connection error</h3><p>Check internet and reload.</p></div>`;
  } finally {
    const l = document.getElementById('loader');
    l.classList.add('done');
    setTimeout(()=>l.remove(), 350);
  }
}

if ('serviceWorker' in navigator)
  window.addEventListener('load', ()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));

loadCart();
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
