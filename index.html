<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#D91C2D" id="themeMetaColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Store">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff;--bg2:#f5f5f5;--bg3:#ebebeb;--card:#fff;--txt:#111;--txt2:#555;--txt3:#999;--red:#D91C2D;--red2:#a81422;--border:#e0e0e0;--shadow:0 2px 14px rgba(0,0,0,.07);--shadow2:0 6px 24px rgba(0,0,0,.12);--r:12px;--hh:56px;--bnh:64px}
[data-theme=dark]{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--card:#1a1a1a;--txt:#f5f5f5;--txt2:#aaa;--txt3:#666;--red:#e8192c;--red2:#c01525;--border:#2a2a2a;--shadow:0 2px 14px rgba(0,0,0,.45);--shadow2:0 6px 24px rgba(0,0,0,.55)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;transition:background .2s,color .2s}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
img{display:block;max-width:100%;object-fit:cover}
a{text-decoration:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit;-webkit-appearance:none}

/* HEADER */
#hdr{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--hh);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;transition:background .2s,border-color .2s}
.hbtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--txt);flex-shrink:0}
.hbtn:active{background:var(--bg2);transform:scale(.93)}
#sname{flex:1;font-size:18px;font-weight:900;letter-spacing:-.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#cartBtn{position:relative}
#cartBadge{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px}

/* SEARCH */
#srchOverlay{position:fixed;inset:0;z-index:200;background:var(--bg);transform:translateY(-105%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
#srchOverlay.open{transform:translateY(0)}
#srchHead{height:var(--hh);display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border)}
#srchInput{flex:1;height:40px;background:var(--bg2);border:none;border-radius:10px;padding:0 14px;font-size:15px;outline:none;color:var(--txt)}
#srchInput::placeholder{color:var(--txt3)}
#srchResults{overflow-y:auto;max-height:calc(100vh - 56px);padding:10px}
.sri{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer}
.sri:active{background:var(--bg2)}
.sri-img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--bg2);flex-shrink:0}
.sri-name{font-size:14px;font-weight:600}
.sri-price{font-size:13px;color:var(--red);font-weight:700;margin-top:2px}
#srchEmpty{padding:36px;text-align:center;color:var(--txt3);font-size:14px}

/* MAIN */
#main{padding-top:var(--hh);padding-bottom:var(--bnh)}

/* INSTALL BANNER */
#instBanner{background:var(--red);color:#fff;padding:9px 12px;display:none;align-items:center;gap:8px;font-size:13px}
#instBanner.show{display:flex}
#instBtn{margin-left:auto;background:#fff;color:var(--red);font-weight:800;font-size:12px;padding:5px 13px;border-radius:20px;flex-shrink:0}
#instDismiss{width:30px;height:30px;display:flex;align-items:center;justify-content:center;opacity:.8;flex-shrink:0}

/* HERO */
#hero{position:relative;overflow:hidden;background:var(--bg2);height:210px}
#cTrack{display:flex;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);will-change:transform}
.cSlide{min-width:100%;height:210px;position:relative;overflow:hidden;display:flex;align-items:flex-end;flex-shrink:0}
.cSlide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cOverlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65) 0%,rgba(0,0,0,.1) 55%,transparent 100%)}
.cContent{position:relative;z-index:1;padding:16px 14px;color:#fff;width:100%}
.cBadge{display:inline-block;background:var(--red);font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.cTitle{font-size:21px;font-weight:900;line-height:1.15;margin-bottom:4px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.cSub{font-size:13px;opacity:.9;margin-bottom:10px}
.cCta{display:inline-block;background:#fff;color:var(--red);font-size:12px;font-weight:800;padding:6px 16px;border-radius:20px}
.cEmpty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:13px}
#cDots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2}
.dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.45);transition:all .3s;cursor:pointer}
.dot.active{background:#fff;width:18px}
.cArrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(0,0,0,.28);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#cPrev{left:8px}
#cNext{right:8px}

/* SECTION HEADER */
.sec-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 10px}
.sec-ttl{font-size:16px;font-weight:800;letter-spacing:-.3px}
.see-all{font-size:13px;color:var(--red);font-weight:600}

/* CATEGORY PILLS */
#catRow{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none}
#catRow::-webkit-scrollbar{display:none}
.cpill{flex-shrink:0;height:34px;padding:0 16px;background:var(--bg2);border-radius:17px;font-size:13px;font-weight:600;color:var(--txt2);border:1.5px solid var(--border);transition:all .2s;white-space:nowrap}
.cpill.active{background:var(--red);color:#fff;border-color:var(--red)}
.cpill:active{transform:scale(.96)}

/* FLASH SALE */
#flashSec{margin-bottom:8px}
.flash-hd{background:var(--red);padding:11px 14px;display:flex;align-items:center;gap:8px}
.flash-lbl{font-size:15px;font-weight:800;color:#fff;display:flex;align-items:center;gap:5px}
#countdown{display:flex;align-items:center;gap:3px;margin-left:auto}
.tb{background:rgba(0,0,0,.22);border-radius:6px;padding:4px 7px;text-align:center;min-width:38px}
.tb span{display:block;font-size:16px;font-weight:900;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.tb label{display:block;font-size:9px;color:rgba(255,255,255,.7);font-weight:700;margin-top:1px;letter-spacing:.5px}
.tsep{font-size:15px;font-weight:900;color:rgba(255,255,255,.55)}
@keyframes pulse-t{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.tick{animation:pulse-t .15s ease-out}
#flashScroll{display:flex;gap:10px;overflow-x:auto;padding:12px 14px;background:var(--bg2);scrollbar-width:none}
#flashScroll::-webkit-scrollbar{display:none}

/* PRODUCT CARD */
.pcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:transform .18s,box-shadow .18s}
.pcard:active{transform:scale(.97);box-shadow:var(--shadow2)}
.pcard-flash{flex-shrink:0;width:152px}
.pi-wrap{position:relative;padding-top:100%;background:var(--bg2);overflow:hidden}
.pi-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.no-img-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--txt3)}
.disc-badge{position:absolute;top:7px;left:7px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;z-index:1}
.pbody{padding:9px 10px 11px}
.pname{font-size:13px;font-weight:600;line-height:1.3;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--txt)}
.pprices{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.pprice{font-size:15px;font-weight:800;color:var(--txt)}
.pwas{font-size:12px;color:var(--txt3);text-decoration:line-through}
.pstock{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.psbar-bg{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.psbar{height:100%;background:var(--red);border-radius:2px}
.pslabel{font-size:11px;color:var(--txt3);flex-shrink:0}
.padd{width:100%;height:34px;background:var(--red);color:#fff;font-size:13px;font-weight:700;border-radius:7px;transition:background .15s}
.padd:active{background:var(--red2)}

/* GRID */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}

/* EMPTY */
.empty{padding:44px 20px;text-align:center;color:var(--txt3);grid-column:1/-1}
.empty svg{margin:0 auto 14px;opacity:.3}
.empty h3{font-size:15px;font-weight:700;color:var(--txt2);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.5}

/* BOTTOM NAV */
#bnav{position:fixed;bottom:0;left:0;right:0;z-index:100;height:var(--bnh);background:var(--bg);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--txt3);font-size:10px;font-weight:600}
.ni.active{color:var(--red)}

/* CART DRAWER */
#cOver{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s}
#cOver.open{background:rgba(0,0,0,.5);pointer-events:all}
#cDrawer{position:fixed;bottom:0;left:0;right:0;z-index:160;background:var(--bg);border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .33s cubic-bezier(.4,0,.2,1)}
#cDrawer.open{transform:translateY(0)}
.cdrag{width:38px;height:4px;background:var(--bg3);border-radius:2px;margin:11px auto 0}
.ctop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.ctop h3{font-size:17px;font-weight:800}
#cClose{width:30px;height:30px;background:var(--bg2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--txt2)}
#cItems{flex:1;overflow-y:auto;padding:0 12px}
.ci{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.ci:last-child{border-bottom:none}
.ci-img{width:58px;height:58px;border-radius:8px;object-fit:cover;background:var(--bg2);flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ci-price{font-size:14px;font-weight:800;color:var(--red);margin-top:2px}
.ci-qty{display:flex;align-items:center;gap:7px;margin-top:5px}
.qbtn{width:26px;height:26px;border-radius:6px;background:var(--bg2);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.qbtn:active{background:var(--bg3)}
.qnum{font-size:14px;font-weight:700;min-width:18px;text-align:center}
.ci-del{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--txt3);flex-shrink:0}
.cfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.ctotal-row{display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin-bottom:12px}
#chkBtn{width:100%;height:50px;background:var(--red);color:#fff;font-size:16px;font-weight:800;border-radius:13px}
#chkBtn:active{background:var(--red2)}
.cempty{padding:36px;text-align:center;color:var(--txt3)}
.cempty svg{margin:0 auto 10px;opacity:.3}

/* PRODUCT MODAL */
#pModal{position:fixed;inset:0;z-index:180;background:var(--bg);transform:translateY(105%);transition:transform .33s cubic-bezier(.4,0,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch}
#pModal.open{transform:translateY(0)}
#pModalBack{position:sticky;top:0;z-index:1;background:var(--bg);height:var(--hh);display:flex;align-items:center;padding:0 12px;gap:8px;border-bottom:1px solid var(--border)}
.mbback{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--txt)}
.mbback:active{background:var(--bg2)}
#pModalTtl{flex:1;font-size:16px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#pModalImg{background:var(--bg2);aspect-ratio:1/1}
#pModalImg img{width:100%;height:100%;object-fit:contain}
#pModalBody{padding:16px}
#pModalName{font-size:18px;font-weight:800;margin-bottom:10px}
.mprices{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#pModalPrice{font-size:24px;font-weight:900}
#pModalWas{font-size:15px;color:var(--txt3);text-decoration:line-through}
#pModalDisc{font-size:12px;font-weight:800;color:var(--red)}
#pModalDesc{font-size:14px;color:var(--txt2);line-height:1.6;margin-bottom:14px}
.mstock{display:flex;align-items:center;gap:8px;margin-bottom:18px;font-size:13px;color:var(--txt2)}
.mstock-bg{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.mstock-fill{height:100%;background:var(--red);border-radius:3px}
#pModalAdd{width:100%;height:50px;background:var(--red);color:#fff;font-size:16px;font-weight:800;border-radius:13px;margin-bottom:calc(env(safe-area-inset-bottom) + 8px)}
#pModalAdd:active{background:var(--red2)}

/* CHECKOUT */
#chkModal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
#chkModal.show{display:flex}
#chkSheet{background:var(--bg);border-radius:22px 22px 0 0;width:100%;padding:22px 16px calc(22px + env(safe-area-inset-bottom));animation:slideUp .3s ease-out}
#chkSheet h3{font-size:17px;font-weight:800;margin-bottom:16px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg textarea{width:100%;height:44px;border:1.5px solid var(--border);border-radius:9px;padding:0 12px;font-size:15px;background:var(--bg);outline:none;transition:border-color .2s}
.fg input:focus,.fg textarea:focus{border-color:var(--red)}
.fg textarea{height:72px;padding:10px 12px;resize:none}
#placeOrderBtn{width:100%;height:50px;background:var(--red);color:#fff;font-size:16px;font-weight:800;border-radius:13px;margin-top:4px}
#placeOrderBtn:active{background:var(--red2)}
#cancelChkBtn{width:100%;height:42px;font-size:13px;color:var(--txt2);margin-top:6px}

/* MENU DRAWER */
#mOver{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s}
#mOver.open{background:rgba(0,0,0,.5);pointer-events:all}
#mDrawer{position:fixed;top:0;left:0;bottom:0;z-index:160;width:78%;max-width:290px;background:var(--bg);transform:translateX(-105%);transition:transform .33s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
#mDrawer.open{transform:translateX(0)}
.mhead{padding:20px 16px 14px;border-bottom:1px solid var(--border)}
.mstore{font-size:19px;font-weight:900}
.mtag{font-size:13px;color:var(--txt3);margin-top:3px}
.mlinks{flex:1;overflow-y:auto;padding:8px 0}
.mlink{display:flex;align-items:center;gap:13px;padding:13px 16px;font-size:15px;font-weight:600;color:var(--txt)}
.mlink:active{background:var(--bg2)}
.mlink svg{color:var(--txt3);flex-shrink:0}
.mfoot{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.mtgl-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--txt2)}
.tgl{width:44px;height:25px;background:var(--bg3);border-radius:13px;position:relative;cursor:pointer;transition:background .25s;border:1.5px solid var(--border);flex-shrink:0}
.tgl.on{background:var(--red);border-color:var(--red)}
.tgl-k{position:absolute;top:2px;left:2px;width:19px;height:19px;background:#fff;border-radius:50%;transition:transform .25s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tgl.on .tgl-k{transform:translateX(19px)}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--bnh) + 12px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--txt);color:var(--bg);font-size:13px;font-weight:600;padding:9px 18px;border-radius:30px;white-space:nowrap;opacity:0;pointer-events:none;transition:all .22s;z-index:300;box-shadow:var(--shadow2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* LOADING */
#loader{position:fixed;inset:0;z-index:400;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;transition:opacity .3s}
#loader.done{opacity:0;pointer-events:none}
.spin{width:32px;height:32px;border:3px solid var(--bg2);border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.aup{opacity:0}.aup.vis{animation:fadeUp .32s ease-out forwards}
.s0{animation-delay:0ms}.s1{animation-delay:50ms}.s2{animation-delay:100ms}.s3{animation-delay:150ms}.s4{animation-delay:200ms}.s5{animation-delay:250ms}
.sgap{height:10px;background:var(--bg2)}
</style>
</head>
<body data-theme="light">

<div id="loader"><div class="spin"></div><span style="font-size:13px;color:var(--txt3)">Loading...</span></div>
<div id="toast"></div>

<!-- INSTALL -->
<div id="instBanner">
  <span>Install app for the best experience</span>
  <button id="instBtn">Install</button>
  <button id="instDismiss"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
</div>

<!-- HEADER -->
<header id="hdr">
  <button class="hbtn" id="menuBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <span id="sname">Store</span>
  <button class="hbtn" id="themeBtn"><svg id="sunIco" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg><svg id="moonIco" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
  <button class="hbtn" id="srchBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></button>
  <button class="hbtn" id="cartBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><span id="cartBadge"></span></button>
</header>

<!-- SEARCH OVERLAY -->
<div id="srchOverlay">
  <div id="srchHead">
    <input type="search" id="srchInput" placeholder="Search products..." autocomplete="off">
    <button id="srchClose" class="hbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 18L18 6M6 6l12 12"/></svg></button>
  </div>
  <div id="srchResults"></div>
</div>

<!-- MENU DRAWER -->
<div id="mOver"></div>
<nav id="mDrawer">
  <div class="mhead">
    <div class="mstore" id="mStoreName">Store</div>
    <div class="mtag" id="mTagline">Fast delivery. Real deals.</div>
  </div>
  <div class="mlinks">

<script>
'use strict';

/* ===== SUPABASE ===== */
const SB_URL = 'https://qmwlphribvncdtgzbixt.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2xwaHJpYnZuY2R0Z3piaXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDkwMjcsImV4cCI6MjA5NTg4NTAyN30.kmXKSrnQxG6n8RdK6ppNvn05vi7Xl68LKUNW5f7CQCU';

/* ===== THEME ===== */
let dark = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && matchMedia('(prefers-color-scheme:dark)').matches);
function applyTheme() {
  document.body.dataset.theme = dark ? 'dark' : 'light';

  document.getElementById('sunIco').style.display = dark ? 'none' : '';

  document.getElementById('tglLabel').textContent = dark ? 'Dark Mode' : 'Light Mode';
}
function toggleTheme() { dark = !dark; localStorage.setItem('theme', dark ? 'dark' : 'light'); applyTheme(); }
applyTheme();

/* ===== CAROUSEL ===== */
let cIdx = 0, cItems = [], cTimer;
let txStart = 0, tyStart = 0;
function initCarousel(banners) {
  const track = document.getElementById('cTrack'), dots = document.getElementById('cDots');
  if (!banners.length) {
    document.getElementById('hero').innerHTML = `<div class="cEmpty">No banners yet</div>`;
    return;
  }
  cItems = banners;
  track.innerHTML = banners.map(b => `
    <div class="cSlide">
      ${b.image_url ? `<img src="${b.image_url}" alt="${b.title || ''}">` : `<div style="position:absolute;inset:0;background:${b.bg_color||'#D91C2D'}"></div>`}
      <div class="cOverlay"></div>
      <div class="cContent">
        ${b.badge ? `<span class="cBadge">${b.badge}</span>` : ''}
        ${b.title ? `<div class="cTitle">${b.title}</div>` : ''}
        ${b.subtitle ? `<div class="cSub">${b.subtitle}</div>` : ''}
        ${b.cta_text ? `<span class="cCta">${b.cta_text}</span>` : ''}
      </div>
    </div>`).join('');
  dots.innerHTML = banners.map((_, i) => `<div class="dot${i===0?' active':''}" onclick="goSlide(${i})"></div>`).join('');
  goSlide(0);
  startC();
  const hero = document.getElementById('hero');
  hero.addEventListener('touchstart', e => { txStart = e.touches[0].clientX; tyStart = e.touches[0].clientY; stopC(); }, { passive: true });
  hero.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - txStart;
    const dy = e.changedTouches[0].clientY - tyStart;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 38) dx < 0 ? nextSlide() : prevSlide();
    startC();
  }, { passive: true });
}
function goSlide(i) {
  cIdx = ((i % cItems.length) + cItems.length) % cItems.length;
  document.getElementById('cTrack').style.transform = `translateX(-${cIdx * 100}%)`;
  document.querySelectorAll('.dot').forEach((d, j) => d.classList.toggle('active', j === cIdx));
}
function nextSlide() { goSlide(cIdx + 1); }
function prevSlide() { goSlide(cIdx - 1); }
function startC() { stopC(); if (cItems.length > 1) cTimer = setInterval(nextSlide, 3600); }
function stopC() { clearInterval(cTimer); }
document.getElementById('cNext').onclick = () => { nextSlide(); stopC(); startC(); };
document.getElementById('cPrev').onclick = () => { prevSlide(); stopC(); startC(); };

/* ===== CATEGORIES ===== */
let activeCat = 'All', allProds = [];
function renderCats(cats) {
  document.getElementById('catRow').innerHTML = ['All', ...cats].map((c, i) =>
    `<button class="cpill aup s${Math.min(i,5)}${c===activeCat?' active':''}" onclick="filterCat('${c}')">${c}</button>`
  ).join('');
  observeAll(document.querySelectorAll('.cpill.aup'));
}
function filterCat(cat) {
  activeCat = cat;
  document.querySelectorAll('.cpill').forEach(p => p.classList.toggle('active', p.textContent === cat));
  const f = cat === 'All' ? allProds : allProds.filter(p => p.category === cat);
  renderGrid(f, 'allGrid');
  document.getElementById('pCount').textContent = `${f.length} item${f.length !== 1 ? 's' : ''}`;
  document.getElementById('allSec').scrollIntoView({ behavior: 'smooth' });
}

/* ===== COUNTDOWN ===== */
let cdTimer;
function startCountdown(endTs) {
  clearInterval(cdTimer);
  function tick() {
    const d = endTs - Date.now();
    if (d <= 0) { clearInterval(cdTimer); document.getElementById('flashSec').style.display = 'none'; document.getElementById('flashGap').style.display = 'none'; return; }
    const h = Math.floor(d / 3600000), m = Math.floor((d % 3600000) / 60000), s = Math.floor((d % 60000) / 1000);
    function set(id, v) { const el = document.getElementById(id), str = String(v).padStart(2, '0'); if (el.textContent !== str) { el.textContent = str; el.classList.remove('tick'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('tick'))); } }
    set('cdH', h); set('cdM', m); set('cdS', s);
  }
  tick();
  cdTimer = setInterval(tick, 1000);
}

/* ===== CURRENCY ===== */
let currency = '₦';
function fmt(n) { return currency + Number(n).toLocaleString('en-NG'); }

/* ===== PRODUCT CARD ===== */
function cardHTML(p, cls = 'pcard') {
  const disc = p.original_price && p.original_price > p.price ? Math.round((1 - p.price / p.original_price) * 100) : 0;
  const total = p.max_stock || (p.stock + 10);
  const stockPct = total > 0 ? Math.min(100, Math.round((p.stock / total) * 100)) : 100;
  return `
    <div class="${cls} aup" onclick="openProduct(${p.id})">
      <div class="pi-wrap">
        ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}" loading="lazy">` : `<div class="no-img-ph"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`}
        ${disc > 0 ? `<span class="disc-badge">-${disc}%</span>` : ''}
      </div>
      <div class="pbody">
        <div class="pname">${p.name}</div>
        <div class="pprices">
          <span class="pprice">${fmt(p.price)}</span>
          ${disc > 0 ? `<span class="pwas">${fmt(p.original_price)}</span>` : ''}
        </div>
        ${p.stock > 0 ? `<div class="pstock"><div class="psbar-bg"><div class="psbar" style="width:${stockPct}%"></div></div><span class="pslabel">${p.stock} left</span></div>` : ''}
        <button class="padd" onclick="event.stopPropagation();addToCart(${p.id})">Add to Cart</button>
      </div>
    </div>`;
}

function renderFlashScroll(prods) {
  const el = document.getElementById('flashScroll');
  el.innerHTML = prods.map((p, i) => `<div style="flex-shrink:0;width:152px" class="aup s${Math.min(i,5)}">${cardHTML(p, 'pcard pcard-flash')}</div>`).join('');
  observeAll(el.querySelectorAll('.aup'));
}

function renderGrid(prods, containerId) {
  const el = document.getElementById(containerId);
  if (!prods.length) {
    el.innerHTML = `<div class="empty"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><h3>No products here</h3><p>Check back soon.</p></div>`;
    return;
  }
  el.innerHTML = prods.map((p, i) => `<div class="aup s${Math.min(i % 6, 5)}">${cardHTML(p)}</div>`).join('');
  observeAll(el.querySelectorAll('.aup'));
}

/* ===== PRODUCT MODAL ===== */
function openProduct(id) {
  const p = allProds.find(x => x.id === id);
  if (!p) return;
  document.getElementById('pModalTtl').textContent = p.name;
  document.getElementById('pModalName').textContent = p.name;
  const imgEl = document.getElementById('pModalImgEl');
  if (p.image_url) { imgEl.src = p.image_url; document.getElementById('pModalImg').style.display = ''; }
  else document.getElementById('pModalImg').style.display = 'none';
  document.getElementById('pModalPrice').textContent = fmt(p.price);
  const disc = p.original_price && p.original_price > p.price ? Math.round((1 - p.price / p.original_price) * 100) : 0;
  document.getElementById('pModalWas').textContent = disc ? fmt(p.original_price) : '';
  document.getElementById('pModalDisc').textContent = disc ? `-${disc}% OFF` : '';
  document.getElementById('pModalDesc').textContent = p.description || '';
  if (p.stock > 0) {
    const total = p.max_stock || (p.stock + 10);
    document.getElementById('pModalStockFill').style.width = Math.min(100, Math.round(p.stock / total * 100)) + '%';
    document.getElementById('pModalStockLbl').textContent = `${p.stock} in stock`;
    document.getElementById('pModal').querySelector('.mstock').style.display = 'flex';
  } else {
    document.getElementById('pModal').querySelector('.mstock').style.display = 'none';
  }
  document.getElementById('pModalAdd').onclick = () => { addToCart(id); closeProduct(); };
  document.getElementById('pModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeProduct() { document.getElementById('pModal').classList.remove('open'); document.body.style.overflow = ''; }
document.getElementById('pModalClose').onclick = closeProduct;

/* ===== CART ===== */
let cart = [];
function loadCart() { try { cart = JSON.parse(localStorage.getItem('cart_v2')) || []; } catch { cart = []; } updateCartUI(); }
function saveCart() { localStorage.setItem('cart_v2', JSON.stringify(cart)); }

function addToCart(id) {
  const p = allProds.find(x => x.id === id);
  if (!p) return;
  const ex = cart.find(x => x.id === id);
  if (ex) ex.qty++;
  else cart.push({ id, name: p.name, price: p.price, image_url: p.image_url, qty: 1 });
  saveCart(); updateCartUI();
  toast(`Added to cart`);
}
function removeFromCart(id) { cart = cart.filter(x => x.id !== id); saveCart(); updateCartUI(); renderCartItems(); }
function changeQty(id, d) { const i = cart.find(x => x.id === id); if (i) { i.qty = Math.max(1, i.qty + d); saveCart(); updateCartUI(); renderCartItems(); } }
function updateCartUI() {
  const total = cart.reduce((s, x) => s + x.qty, 0);
  const badge = document.getElementById('cartBadge');
  badge.textContent = total; badge.style.display = total > 0 ? 'flex' : 'none';
  document.getElementById('cTotal').textContent = fmt(cart.reduce((s, x) => s + x.price * x.qty, 0));
}
function renderCartItems() {
  const el = document.getElementById('cItems');
  if (!cart.length) {
    el.innerHTML = `<div class="cempty"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><p>Your cart is empty</p></div>`;
    return;
  }
  el.innerHTML = cart.map(item => `
    <div class="ci">
      ${item.image_url ? `<img class="ci-img" src="${item.image_url}" alt="">` : `<div class="ci-img" style="display:flex;align-items:center;justify-content:center;background:var(--bg2)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div>`}
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">${fmt(item.price)}</div>
        <div class="ci-qty">
          <button class="qbtn" onclick="changeQty(${item.id},-1)">-</button>
          <span class="qnum">${item.qty}</span>
          <button class="qbtn" onclick="changeQty(${item.id},1)">+</button>
        </div>
      </div>
      <button class="ci-del" onclick="removeFromCart(${item.id})"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
    </div>`).join('');
}
function openCart() { renderCartItems(); document.getElementById('cDrawer').classList.add('open'); document.getElementById('cOver').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeCart() { document.getElementById('cDrawer').classList.remove('open'); document.getElementById('cOver').classList.remove('open'); document.body.style.overflow = ''; }

/* ===== CHECKOUT ===== */
function openCheckout() { if (!cart.length) { toast('Cart is empty'); return; } closeCart(); document.getElementById('chkModal').classList.add('show'); }
function closeCheckout() { document.getElementById('chkModal').classList.remove('show'); }
document.getElementById('placeOrderBtn').onclick = async () => {
  const name = document.getElementById('oName').value.trim();
  const phone = document.getElementById('oPhone').value.trim();
  const address = document.getElementById('oAddress').value.trim();
  if (!name || !phone || !address) { toast('Please fill all fields'); return; }
  document.getElementById('placeOrderBtn').textContent = 'Placing order...';
  document.getElementById('placeOrderBtn').disabled = true;
  try {
    const { error } = await sb.from('orders').insert([{
      customer_name: name, phone, address,
      items: cart,
      total: cart.reduce((s, x) => s + x.price * x.qty, 0),
      status: 'pending'
    }]);
    if (error) throw error;
    cart = []; saveCart(); updateCartUI();
    closeCheckout();
    ['oName', 'oPhone', 'oAddress'].forEach(id => document.getElementById(id).value = '');
    toast('Order placed successfully!');
  } catch (e) {
    toast('Failed to place order. Try again.');
    console.error(e);
  } finally {
    document.getElementById('placeOrderBtn').textContent = 'Place Order';
    document.getElementById('placeOrderBtn').disabled = false;
  }
};

/* ===== SEARCH ===== */
document.getElementById('srchBtn').onclick = () => { document.getElementById('srchOverlay').classList.add('open'); setTimeout(() => document.getElementById('srchInput').focus(), 280); };
document.getElementById('srchClose').onclick = closeSearch;
function closeSearch() { document.getElementById('srchOverlay').classList.remove('open'); document.getElementById('srchInput').value = ''; document.getElementById('srchResults').innerHTML = ''; }
document.getElementById('srchInput').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const el = document.getElementById('srchResults');
  if (!q) { el.innerHTML = ''; return; }
  const res = allProds.filter(p => p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q));
  if (!res.length) { el.innerHTML = '<div id="srchEmpty">No products found</div>'; return; }
  el.innerHTML = res.map(p => `
    <div class="sri" onclick="closeSearch();openProduct(${p.id})">
      ${p.image_url ? `<img class="sri-img" src="${p.image_url}" alt="">` : `<div class="sri-img" style="background:var(--bg2);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div>`}
      <div><div class="sri-name">${p.name}</div><div class="sri-price">${fmt(p.price)}</div></div>
    </div>`).join('');
});

/* ===== MENU ===== */
document.getElementById('menuBtn').onclick = () => { document.getElementById('mDrawer').classList.add('open'); document.getElementById('mOver').classList.add('open'); };
document.getElementById('mOver').onclick = closeMenu;
function closeMenu() { document.getElementById('mDrawer').classList.remove('open'); document.getElementById('mOver').classList.remove('open'); }

/* ===== TOAST ===== */
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ===== SCROLL REVEAL ===== */
let io;
function observeAll(els) {
  if (!io) io = new IntersectionObserver(entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('vis'); io.unobserve(e.target); } }), { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });
  els.forEach(el => io.observe(el));
}

/* ===== PWA ===== */
let dp;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dp = e; if (!localStorage.getItem('instDismissed')) document.getElementById('instBanner').classList.add('show'); });
document.getElementById('instBtn').onclick = async () => { if (!dp) return; dp.prompt(); await dp.userChoice; dp = null; document.getElementById('instBanner').classList.remove('show'); };
document.getElementById('instDismiss').onclick = () => { document.getElementById('instBanner').classList.remove('show'); localStorage.setItem('instDismissed', '1'); };

/* ===== INIT ===== */
async function init() {
  try {
    const [
      { data: products },
      { data: banners },
      { data: settings }
    ] = await Promise.all([
      sb.from('products').select('*').order('created_at', { ascending: false }),
      sb.from('banners').select('*').order('sort_order', { ascending: true }),
      sb.from('store_settings').select('*')
    ]);

    const get = key => settings?.find(s => s.key === key)?.value;
    const storeName = get('storeName') || 'Store';
    const tagline = get('tagline') || 'Fast delivery. Real deals.';
    const flashEnd = get('flashSaleEnd') ? parseInt(get('flashSaleEnd')) : null;
    const cats = get('categories') ? JSON.parse(get('categories')) : [];
    currency = get('currency') || '₦';

    document.getElementById('sname').textContent = storeName;
    document.getElementById('mStoreName').textContent = storeName;
    document.getElementById('mTagline').textContent = tagline;
    document.title = storeName;

    allProds = products || [];

    initCarousel(banners || []);
    const allCats = cats.length ? cats : [...new Set(allProds.map(p => p.category).filter(Boolean))];
    renderCats(allCats);

    const flashProds = allProds.filter(p => p.flash_sale);
    if (flashEnd && Date.now() < flashEnd && flashProds.length) {
      document.getElementById('flashSec').style.display = '';
      document.getElementById('flashGap').style.display = '';
      startCountdown(flashEnd);
      renderFlashScroll(flashProds);
    }

    const featured = allProds.filter(p => p.featured);
    if (featured.length) {
      document.getElementById('featSec').style.display = '';
      document.getElementById('featGap').style.display = '';
      renderGrid(featured, 'featGrid');
    }

    renderGrid(allProds, 'allGrid');
    document.getElementById('pCount').textContent = `${allProds.length} item${allProds.length !== 1 ? 's' : ''}`;
  } catch (err) {
    console.error('Load error:', err);
    document.getElementById('allGrid').innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>Connection error</h3><p>Check your internet connection and reload.</p></div>`;
  } finally {
    const loader = document.getElementById('loader');
    loader.classList.add('done');
    setTimeout(() => loader.remove(), 400);
  }
}

if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
loadCart();
document.addEventListener('DOMContentLoaded', init);
</script>
