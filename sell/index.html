<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<meta name="robots" content="noindex,nofollow">
<title>Marcato Seller Center</title>
<link rel="icon" type="image/png" sizes="32x32" href="/vendor/app-icon-32.png">
<link rel="apple-touch-icon" href="/vendor/apple-touch-icon.png">
<style>
:root{--red:#D91C2D;--red2:#a81422;--ink:#141414;--bg:#f5f5f5}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{text-decoration:none;color:inherit}
.sc{flex:1;display:flex;flex-direction:column;align-items:center;width:100%;max-width:420px;margin:0 auto;padding:0 24px}
.brand{margin-top:clamp(64px,16vh,140px);display:flex;flex-direction:column;align-items:center;text-align:center}
.brand img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 22px rgba(0,0,0,.14)}
.brand b{margin-top:16px;font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1.1}
.brand span{margin-top:6px;font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--red)}
.actions{width:100%;margin-top:clamp(56px,14vh,110px);display:flex;flex-direction:column;gap:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;height:56px;border-radius:8px;font-size:17px;font-weight:500;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98);opacity:.9}
.btnEmail{background:#fff;color:#1c1c1c;box-shadow:0 2px 6px rgba(0,0,0,.22)}
.btnSell{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.foot{margin-top:auto;padding:36px 0 24px;font-size:13px;color:#77777c;text-align:center}
.foot a{color:var(--red);font-weight:700}
</style>
</head>
<body>
<main class="sc">
  <div class="brand">
    <img src="/vendor/app-icon-maskable-192.png" alt="Marcato">
    <b>Marcato</b>
    <span>Seller Center</span>
  </div>
  <div class="actions">
    <a class="btn btnEmail" id="signInBtn" href="/vendor/?intent=signin">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3" fill="#1c1c1c"/><path d="M3 7.5l9 6 9-6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Sign in with Email
    </a>
    <a class="btn btnSell" id="sellBtn" href="/sell/register/">Sell on Marcato</a>
  </div>
  <div class="foot">Looking to shop? <a href="/">Go to Marcato</a></div>
</main>
</body>
</html>
