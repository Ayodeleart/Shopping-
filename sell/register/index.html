<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<meta name="robots" content="noindex,nofollow">
<title>Sell on Marcato</title>
<link rel="icon" type="image/png" sizes="32x32" href="/vendor/app-icon-32.png">
<link rel="apple-touch-icon" href="/vendor/apple-touch-icon.png">
<style>
:root{--red:#D91C2D;--navy:#2c3f8f;--ink:#1c1c1c;--bg:#f5f5f5}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top,0) + 18px) 16px calc(env(safe-area-inset-bottom,0) + 24px)}
a{text-decoration:none}
.wrap{max-width:440px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#77777c;letter-spacing:.3px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#77777c}
.steps{display:flex;align-items:center;margin:16px 6px 0}
.dot{width:30px;height:30px;border-radius:50%;background:#e2e2e2;color:#666;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dot.on{background:var(--red);color:#fff}
.bar{flex:1;height:2px;background:#e2e2e2;margin:0 4px}
.stepName{margin:8px 0 0 10px;font-size:14px;font-weight:800}
h1{text-align:center;font-size:26px;font-weight:600;margin:34px 0 10px}
.lead{text-align:center;font-size:14px;color:#555;line-height:1.5}
.panel{background:#fff;border-radius:18px;padding:26px 18px 22px;margin-top:26px}
fieldset{border:1px solid #d0d0d0;border-radius:8px;padding:14px 12px 12px;min-width:0}
legend{padding:0 8px;font-size:14px}
.opt{display:block;position:relative;border:1.5px solid;border-radius:8px;margin-bottom:14px;cursor:pointer;background:#fff;overflow:hidden}
.opt:last-child{margin-bottom:0}
.opt input{position:absolute;opacity:0;pointer-events:none}
.optHd{display:flex;align-items:center;gap:12px;padding:14px 14px 12px;font-size:19px;font-weight:600}
.optHd svg{flex-shrink:0}
.radio{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.radio::after{content:'';width:12px;height:12px;border-radius:50%;background:currentColor;transform:scale(0);transition:transform .15s}
.opt input:checked ~ .optHd .radio::after{transform:scale(1)}
.optSub{border-top:1.5px solid;margin:0 12px;padding:10px 0;text-align:center;font-size:13.5px}
.local{border-color:var(--red);color:var(--red)}
.local .optSub{border-color:var(--red)}
.intl{border-color:var(--navy);color:var(--navy)}
.intl .optSub{border-color:var(--navy)}
.opt.disabled{opacity:.5;cursor:not-allowed;background:#fafafa}
.soon{white-space:nowrap;margin-left:8px;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:#e9e9ec;color:#555;border-radius:10px;padding:3px 8px;vertical-align:middle}
.note{margin-top:12px;font-size:12.5px;color:#666;line-height:1.5;text-align:center}
.next{display:flex;align-items:center;justify-content:center;width:100%;height:52px;margin-top:22px;border-radius:4px;background:#e0e0e0;color:#fff;font-size:17px;font-weight:700;letter-spacing:.5px;border:none;cursor:not-allowed;font-family:inherit}
.next.ready{background:var(--red);cursor:pointer}
.have{text-align:center;margin-top:34px;font-size:17px}
.have a{color:var(--red);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="/sell/" id="backBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>Seller Center</a>
  </div>
  <h1>Sell on Marcato</h1>
  <p class="lead">Select the country/region where your business is located.</p>

  <div class="panel">
    <fieldset>
      <legend>Where is your business located?</legend>

          Local <span class="radio" aria-hidden="true"></span>
        </div>
        <div class="optSub">(business based in Nigeria)</div>
      </label>
      <label class="opt intl disabled" id="optIntl" aria-disabled="true">
        <input type="radio" name="loc" value="international" id="locIntl" disabled>
        <div class="optHd">
          <svg fill="currentColor" width="30" height="30" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384.747 384.747" aria-hidden="true"><g><path d="M275.684,169.341c-4.237,0-8.222,1.65-11.219,4.646l-31.752,31.753l-26.459,0.002l6.435-6.435 c1.563-1.563,1.563-4.095,0-5.657c-1.563-1.561-4.096-1.561-5.656,0l-12.093,12.093l-51.544,0.004 c-1.062,0-2.078,0.421-2.828,1.171l-9.197,9.197c-0.915,0.915-1.331,2.216-1.116,3.492c0.214,1.276,1.033,2.37,2.196,2.935 l56.174,27.288l-8.19,8.19l-35.617-0.006c-0.001,0-0.001,0-0.001,0c-1.061,0-2.078,0.421-2.828,1.171l-4.68,4.679 c-0.915,0.915-1.331,2.216-1.116,3.492c0.214,1.276,1.033,2.37,2.196,2.935l23.136,11.238c-0.639,1.885-1.12,3.825-1.383,5.806 c-0.455,3.412,0.583,6.853,2.848,9.439c2.271,2.594,5.539,4.082,8.967,4.082c0.001,0,0.001,0,0.002,0 c0.53,0,1.067-0.036,1.599-0.106c1.956-0.261,3.872-0.733,5.735-1.359l10.888,22.68c0.535,1.114,1.554,1.918,2.761,2.179 c0.281,0.061,0.564,0.09,0.846,0.09c0.931,0,1.842-0.325,2.569-0.934l5.092-4.266c0.907-0.76,1.431-1.883,1.431-3.066 l-0.006-35.617l7.635-7.635l25.614,53.379c0.535,1.114,1.555,1.919,2.764,2.18c0.279,0.06,0.562,0.09,0.843,0.09 c0.932,0,1.845-0.326,2.572-0.937l9.998-8.397c0.905-0.76,1.428-1.881,1.428-3.063l0.004-51.003l12.362-12.363 c1.563-1.563,1.563-4.095,0-5.657c-1.563-1.562-4.096-1.562-5.656,0l-6.705,6.705l0.002-24.16l33.171-33.171 c2.997-2.997,4.648-6.981,4.648-11.219c0-4.238-1.651-8.222-4.648-11.219C283.907,170.991,279.923,169.341,275.684,169.341z M141,217.8l4.054-4.054l79.659-0.006l-30.102,30.102L141,217.8z M147.895,266.014l24.541,0.004l-3.478,3.478 c-1.476,1.476-2.773,3.112-3.917,4.846L147.895,266.014z M194.878,313.371l-8.391-17.48c1.758-1.153,3.416-2.464,4.909-3.957 l3.478-3.478L194.878,313.371z M245.725,314.21l-4.622,3.882l-24.6-51.266l29.228-29.229L245.725,314.21z M281.247,190.768 l-85.201,85.202c-0.002,0.002-0.003,0.003-0.005,0.005l-10.302,10.302c-3.555,3.555-8.257,5.878-13.24,6.543 c-0.182,0.024-0.363,0.036-0.542,0.036c-1.122,0-2.196-0.493-2.948-1.352c-0.           <span>International<span class="soon">Soon</span></span> <span class="radio" aria-hidden="true"></span>
        </div>
        <div class="optSub">(business based outside Nigeria)</div>
      </label>
    </fieldset>
    <p class="note">Marcato currently onboards sellers based in Nigeria only. International sellers aren't supported yet.</p>
    <button type="button" class="next" id="nextBtn" disabled>NEXT</button>
  </div>

  <p class="have">Already have an account? <a href="/vendor/?intent=signin" id="signInLink">Sign in</a></p>
</div>
<script>
(function () {
  var local = document.getElementById('locLocal');
  var next = document.getElementById('nextBtn');
  local.addEventListener('change', function () {
    next.disabled = !local.checked;
    next.classList.toggle('ready', local.checked);
  });
  next.addEventListener('click', function () {
    if (!local.checked) return;
    location.href = '/vendor/?intent=register';   // existing vendor registration (create account → onboarding wizard)
  });
})();
</script>
</body>
</html>
